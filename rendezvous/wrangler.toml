# The pairing-code rendezvous Worker. CI deploys it (`wrangler deploy`, .github/workflows/ci.yml);
# its workers.dev URL is the app's VITE_RENDEZVOUS_URL and the NAS server's RENDEZVOUS_URL.
name = "bluray-rendezvous"
main = "src/index.ts"
compatibility_date = "2026-10-17"

# The Cloudflare relay (POST /turn) needs three secrets, set with `wrangler secret put TURN_KEY_ID`,
# `wrangler secret put TURN_KEY_API_TOKEN` and `wrangler secret put TURN_NAS_IDS` (the comma-separated NAS ids it
# mints for; `server/deploy/deploy.sh --nas-id` prints the NAS's); never here. Without them, /turn answers 503
# turn-not-configured.
#
# `NAS_IDS` (a secret or a [vars] entry; comma-separated NAS ids) locks the Worker to those NAS servers: any other
# NAS gets 403 nas-not-allowed at registration and signalling, and its codes read as unknown. Unset or empty, the
# Worker is open to every NAS, which is what a self-hoster's own Worker wants.

[[durable_objects.bindings]]
name = "CODE_REGISTRY"
class_name = "CodeRegistry"

# WebRTC signalling, one object per NAS (`idFromName(nasId)`).
[[durable_objects.bindings]]
name = "SIGNALLING"
class_name = "Signalling"

# SQLite-backed storage, available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CodeRegistry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Signalling"]
