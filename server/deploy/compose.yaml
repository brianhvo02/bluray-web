# Lives on the NAS as ~/bluray-server/compose.yaml; written by deploy.sh.
services:
  bluray-server:
    image: bluray-server:latest
    container_name: bluray-server
    restart: unless-stopped
    environment:
      LIBRARY_ROOTS: drv0=/library/drv0,drv2=/library/drv2,drv3=/library/drv3,drv5=/library/drv5,drv6=/library/drv6,drv7=/library/drv7,drv8=/library/drv8
      DATA_DIR: /data
      PORT: "8080"
      TZ: America/Los_Angeles
      NIGHTLY_SCAN_AT: "04:00"
      PUBLIC_BASE: https://mediaserver.tailnet-8e55.ts.net/bluray/api/
      TRUSTED_PROXY: caddy
      # The rendezvous Worker's URL (https://bluray-rendezvous.<account>.workers.dev), set after its first deploy;
      # empty, codes are not registered with it.
      RENDEZVOUS_URL: ""
    # Long syntax with create_host_path: false, so a missing drive never gets an empty folder made under /mnt;
    # if one is missing, the container fails to start rather than serve an empty drive.
    volumes:
      - type: bind
        source: /mnt/drv0/BDMVs
        target: /library/drv0
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv2/BDMVs
        target: /library/drv2
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv3/BDMVs
        target: /library/drv3
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv5/BDMVs
        target: /library/drv5
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv6/BDMVs
        target: /library/drv6
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv7/BDMVs
        target: /library/drv7
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /mnt/drv8/BDMVs
        target: /library/drv8
        read_only: true
        bind: { create_host_path: false }
      - bluray-data:/data
    networks:
      - caddy_default

volumes:
  bluray-data:

networks:
  caddy_default:
    external: true
