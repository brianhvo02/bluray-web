# Lives on the NAS as ~/bluray-server/compose.yaml; written by deploy.sh.
# With the GPU (/dev/dri/renderD128) a manual restart must include the override, or the quality levels lose it:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
services:
  bluray-server:
    image: bluray-server:latest
    container_name: bluray-server
    restart: unless-stopped
    environment:
      LIBRARY_ROOTS: drv0=/library-mnt/drv0/BDMVs,drv2=/library-mnt/drv2/BDMVs,drv3=/library-mnt/drv3/BDMVs,drv5=/library-mnt/drv5/BDMVs,drv6=/library-mnt/drv6/BDMVs,drv7=/library-mnt/drv7/BDMVs,drv8=/library-mnt/drv8/BDMVs,drv0-dl=/library-mnt/drv0/Downloads@Downloads,drv1-dl=/library-mnt/drv1/Downloads@Downloads,drv2-dl=/library-mnt/drv2/Downloads@Downloads,drv3-dl=/library-mnt/drv3/Downloads@Downloads,drv4-dl=/library-mnt/drv4/Downloads@Downloads,drv2-rips=/library-mnt/drv2/Rips@Rips
      DATA_DIR: /data
      PORT: "8080"
      TZ: America/Los_Angeles
      NIGHTLY_SCAN_AT: "04:00"
      PUBLIC_BASE: https://mediaserver.tailnet-8e55.ts.net/bluray/api/
      TRUSTED_PROXY: caddy
      # The rendezvous Worker (rendezvous/), where owner codes are registered for lookup by code or QR. Empty: codes are
      # not registered, and only devices that already know the NAS address can pair.
      RENDEZVOUS_URL: https://bluray-rendezvous.brianhvo02.workers.dev
      # TheMovieDB key for title matching, read from .env next to this file. Empty: no TMDB lookups.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TITLE_LIBRARY: everyone
      # The WebRTC route (with RENDEZVOUS_URL): ICE uses only UDP 47998, published below and forwarded to the NAS on
      # the home gateway. The NAS advertises its public IPv4 (from STUN) and this LAN address, never Docker's or
      # Tailscale's.
      RTC_LAN_ADDRESS: 192.168.1.98
      # Quality levels: re-encoding on the GPU through Intel Quick Sync (jellyfin-ffmpeg in the image). The render node
      # comes from compose.gpu.yaml, which deploy.sh adds only when the NAS has one; without it, or when the self-test at
      # start fails, only Original is offered. Segments are cached in /data/transcode (50 GB by default).
      LEVELS_BACKEND: qsv
    env_file:
      - path: .env
        required: false
    # Each drive's mount point, not its BDMVs folder: the mount point always exists on the root filesystem, so the
    # container starts with a drive missing, and create_host_path: false means Docker never makes anything under /mnt.
    # rslave lets a drive mounted after the container started (a late nofail mount) appear inside it. A root whose
    # BDMVs folder is missing or empty keeps the discs of its last scan.
    volumes:
      - type: bind
        source: /mnt/drv0
        target: /library-mnt/drv0
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv1
        target: /library-mnt/drv1
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv2
        target: /library-mnt/drv2
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv3
        target: /library-mnt/drv3
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv4
        target: /library-mnt/drv4
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv5
        target: /library-mnt/drv5
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv6
        target: /library-mnt/drv6
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv7
        target: /library-mnt/drv7
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - type: bind
        source: /mnt/drv8
        target: /library-mnt/drv8
        read_only: true
        bind: { create_host_path: false, propagation: rslave }
      - bluray-data:/data
    ports:
      - "47998:47998/udp"
    networks:
      - caddy_default

volumes:
  bluray-data:

networks:
  caddy_default:
    external: true
