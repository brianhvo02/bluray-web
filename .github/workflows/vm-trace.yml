name: VM trace

on:
  push:
    branches: [main]
    paths:
      - 'tools/vm-trace/**'
      - 'scripts/make-vm-disc.ts'
      - 'scripts/make-menu-disc.ts'
      - 'fixtures/synthetic/disc-vm/**'
      - 'fixtures/synthetic/disc-menu/**'
      - 'tests/vm-trace/scripts/**'
      - 'tests/vm-trace/golden/**'
      - 'tests/helpers/synthetic-disc.ts'
      - 'tests/helpers/bdmv-builders.ts'
      - 'tests/helpers/hdmv-builders.ts'
      - 'tests/helpers/ig-builders.ts'
      - '.github/workflows/vm-trace.yml'
  pull_request:
    paths:
      - 'tools/vm-trace/**'
      - 'scripts/make-vm-disc.ts'
      - 'scripts/make-menu-disc.ts'
      - 'fixtures/synthetic/disc-vm/**'
      - 'fixtures/synthetic/disc-menu/**'
      - 'tests/vm-trace/scripts/**'
      - 'tests/vm-trace/golden/**'
      - 'tests/helpers/synthetic-disc.ts'
      - 'tests/helpers/bdmv-builders.ts'
      - 'tests/helpers/hdmv-builders.ts'
      - 'tests/helpers/ig-builders.ts'
      - '.github/workflows/vm-trace.yml'

permissions:
  contents: read

jobs:
  golden:
    name: Golden traces match libbluray
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run vm-trace:build && npm run vm-trace:golden && git diff --exit-code tests/vm-trace/golden/
