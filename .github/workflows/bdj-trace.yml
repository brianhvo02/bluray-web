name: BD-J trace

on:
  push:
    branches: [main]
    paths:
      - 'tools/bdj-trace/**'
      - 'scripts/make-bdj-disc.ts'
      - 'fixtures/synthetic/disc-bdj/**'
      - 'tests/bdj/xlets/**'
      - 'tests/bdj/golden/**'
      - 'tests/helpers/bdjo-builder.ts'
      - 'tests/helpers/bdmv-builders.ts'
      - 'tests/helpers/synthetic-disc.ts'
      - '.github/workflows/bdj-trace.yml'
  pull_request:
    paths:
      - 'tools/bdj-trace/**'
      - 'scripts/make-bdj-disc.ts'
      - 'fixtures/synthetic/disc-bdj/**'
      - 'tests/bdj/xlets/**'
      - 'tests/bdj/golden/**'
      - 'tests/helpers/bdjo-builder.ts'
      - 'tests/helpers/bdmv-builders.ts'
      - 'tests/helpers/synthetic-disc.ts'
      - '.github/workflows/bdj-trace.yml'

permissions:
  contents: read

jobs:
  golden:
    name: Golden trace matches libbluray
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: npm run bdj-trace:build && npm run bdj-trace:golden && git diff --exit-code tests/bdj/golden/
