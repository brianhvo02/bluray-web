name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0 # allowScripts in package.json needs npm 11.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: scripts/ci-audio.sh
      - run: npm run test:e2e
        env:
          # Linux containers measured up to 19 ms mean / 41 ms max offset against the 20/50 ms bounds; 1.5 gives headroom.
          SYNC_TOLERANCE_SCALE: '1.5'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
