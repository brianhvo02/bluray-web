name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0 # allowScripts in package.json needs npm 11.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # One runner per browser project: sharing one 4-vCPU runner with the other browsers starved WebKit (software-rendered,
  # no GPU), whose playback clock and page then fell seconds behind the tests' waits.
  e2e:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chrome }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chromium, browser: chrome }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: scripts/ci-audio.sh
      - run: npm run test:e2e -- --project ${{ matrix.project }}
        env:
          # Linux containers measured up to 19 ms mean / 41 ms max offset against the 20/50 ms bounds; 1.5 gives headroom.
          SYNC_TOLERANCE_SCALE: '1.5'
          # the runners (likely drawing canvases without a GPU) put 26-29% of the animated sign's draws over 8 ms against the spec's 5%; 8 allows 40%
          ASS_BUDGET_SCALE: '8'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # the native ASS renderer against the libass goldens (layout traces and frames)
  ass:
    name: ASS renderer vs libass (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:ass
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ass-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # The pairing-code rendezvous Worker (rendezvous/wrangler.toml). Its own job, so a failure here never blocks the Pages deploy.
  deploy-rendezvous:
    name: Deploy the rendezvous Worker
    needs: [check, e2e, ass]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rendezvous
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler 4 (Node >= 22) deploys SQLite-backed Durable Objects (`new_sqlite_classes`); pinned, not the action's 3.x default
          wranglerVersion: '4.148.0'
          workingDirectory: rendezvous
          command: deploy

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [check, e2e, ass]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # a newer push to main must not cancel an upload halfway; deploys queue instead
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
        env:
          # the Worker's workers.dev URL, a repository variable set after its first deploy; unset, pairing by code reports the service unavailable
          VITE_RENDEZVOUS_URL: ${{ vars.RENDEZVOUS_URL }}
      # dist/_headers carries COOP/COEP; without them SharedArrayBuffer is unavailable
      - run: test -f dist/_headers
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bluray-web --branch=main
