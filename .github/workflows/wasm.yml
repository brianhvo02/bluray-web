name: WASM

on:
  push:
    branches: [main]
    paths: ['src/wasm/**']
  pull_request:
    paths: ['src/wasm/**']

jobs:
  reproducible:
    name: ${{ matrix.module }}.wasm matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [audio, freetype]
    steps:
      - uses: actions/checkout@v4
      - run: src/wasm/${{ matrix.module }}/build.sh
      - run: git diff --exit-code src/wasm/${{ matrix.module }}/
