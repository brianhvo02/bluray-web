name: BD-J class library

on:
  push:
    branches: [main]
    paths: ['tools/bdj-classlib/**', 'tools/bdj-trace/**', 'src/bdj-classlib/**']
  pull_request:
    paths: ['tools/bdj-classlib/**', 'tools/bdj-trace/**', 'src/bdj-classlib/**']

jobs:
  reproducible:
    name: rt-bdj.jar and the libbluray jars match their source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: tools/bdj-trace/build.sh && tools/bdj-classlib/build.sh
      - run: git diff --exit-code src/bdj-classlib/
